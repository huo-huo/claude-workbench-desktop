name: Publish landing page

on:
  push:
    branches: [main]
    paths:
      - 'public/landing.html'
      - 'public/landing-workspace.png'
      - 'public/workbench-icon.png'
      - 'public/favicon.ico'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir site
          cp public/landing.html site/index.html
          cp public/landing-workspace.png public/workbench-icon.png public/favicon.ico site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
