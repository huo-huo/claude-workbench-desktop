            handoffContext: docs/openspec/changes/workspace-file-browser/.comet/handoff/design-context.json
            handoffHash: 43c2b27fbcba60d8c3ac1237fcb68d13579b763ed9cee3ff20fe01bf9be2f502
            proposal: "候选方案：1) 文件栏显示隐藏条目——仅删除 server/workspace/files.mjs 中 workspaceTree()
              的隐藏项过滤（startsWith('.') && !== '.claude'），保留 ~$ 临时文件跳过与
              WORKSPACE_SKIP 重型目录跳过；前端渲染、排序、预算全部复用，不新增开关。2) 内置只读文本查看器——在
              index.html 的 .terminal-column 内、#terminalHost 之后新增 #fileViewer
              覆盖层，.terminal-column 设 position:relative，绝对定位覆盖终端区域，不改 Grid
              行定义，xterm 尺寸与终端会话不受影响；复用已有 GET /api/workspace/file（1MB
              上限+二进制检测），不新增后端路由与依赖；新增 src/workspace/viewer.mjs 负责
              openViewer/closeViewer/renderViewer，src/workspace/state.mjs 增加
              app.viewer 状态，样式追加到
              src/styles/files.css。前端按扩展名判型：非文本（docx/xlsx/pdf/图片/音视频/压缩包）继续走
              openProjectFile() 系统打开，文本类型请求接口，失败用 toast 展示后端原文；双击与 Enter 改为
              activateTreeFile()，右键菜单新增「用系统默认应用打开」。只读 pre
              渲染，无编辑保存。非目标：显示开关、多标签、搜索、语法高亮、Markdown 渲染、图片预览、后端契约变化。Spec
              Patch：无，delta spec 已覆盖全部行为。测试策略：新增 tests/workspace-files.test.mjs
              覆盖隐藏项可见/重型目录排除/文件夹优先排序，npm run
              build，浏览器验收隐藏条目、双击查看器、关闭回终端、右键系统打开。取舍与风险：隐藏项放开后节点变多但重型目录仍挡住；覆盖层不触\
              发终端 resize；扩展名判型与后端二进制判定不一致时以后端为最终判定并指引右键系统打开。"
            requirementsEvidence:
              contentHash: e5f2224428baed2ce7489c50386b14ef09cc7dbd93b2d63741f1782bb59dc005
              ref: docs/openspec/changes/workspace-file-browser
            sourceEvidence:
              contentHash: a1ed644a84d0b365748e0b201f8d23671806c8ade3ac85149170550d19660241
              ref: docs/openspec/changes/workspace-file-browser
